<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#a855f7;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#a855f7;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.5px; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .tag-box { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
    .scan-line { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { transform: translateY(350px); opacity: 0.5; }
      100% { transform: translateY(0px); opacity: 0.1; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)" />
  <rect width="1280" height="400" fill="url(#grid)" />

  <!-- Scanning ray -->
  <line x1="0" y1="20" x2="1280" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="scan-line" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1060" cy="180" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="r" values="140;175;140" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="200" r="130" fill="#06b6d4" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;145;120" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Shield / Emblem Graphics on Right -->
  <g transform="translate(1030, 200)">
    <!-- Outer orbiting particles -->
    <g style="transform-origin: 0px 0px; animation: rotateRing 16s linear infinite;">
      <circle cx="0" cy="-110" r="4" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="95" cy="55" r="3.5" fill="#34d399" filter="url(#glow)" />
      <circle cx="-95" cy="55" r="3" fill="#a855f7" filter="url(#glow)" />
      <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8,12" opacity="0.4" />
    </g>

    <!-- Inner counter-orbiting ring -->
    <g style="transform-origin: 0px 0px; animation: rotateRing 10s linear infinite reverse;">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="14,14" opacity="0.6" />
      <circle cx="82" cy="0" r="4" fill="#818cf8" filter="url(#glow)" />
      <circle cx="-82" cy="0" r="4" fill="#818cf8" filter="url(#glow)" />
    </g>

    <!-- Central Shield Symbol -->
    <path d="M 0 -60 L 50 -35 L 50 15 C 50 48 0 72 0 72 C 0 72 -50 48 -50 15 L -50 -35 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke" values="#38bdf8;#a855f7;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- AI Core Node inside Shield -->
    <circle cx="0" cy="5" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="5" r="7" fill="#38bdf8">
      <animate attributeName="fill" values="#38bdf8;#34d399;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(80, 0)">
    <!-- Top badge -->
    <g transform="translate(0, 75)">
      <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="18" cy="16" r="5" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">CURATED KNOWLEDGE BASE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">
      Awesome <tspan fill="url(#neonGlow)">Responsible AI</tspan> Platform
    </text>

    <!-- Subtitle / Mission statement -->
    <text x="0" y="212" class="subtitle">
      AI Governance • Model Risk Management • Safety Guardrails • Observability &amp; Auditing
    </text>

    <!-- Pillar Tags -->
    <g transform="translate(0, 260)">
      <!-- Tag 1: Fairness & Bias -->
      <rect x="0" y="0" width="135" height="32" class="tag-box" />
      <text x="14" y="21" class="tag">⚖️ Fairness &amp; Bias</text>

      <!-- Tag 2: Explainability -->
      <rect x="150" y="0" width="135" height="32" class="tag-box" />
      <text x="162" y="21" class="tag">🔍 Explainability</text>

      <!-- Tag 3: Safety & Guardrails -->
      <rect x="300" y="0" width="160" height="32" class="tag-box" />
      <text x="312" y="21" class="tag">🛡️ Safety Guardrails</text>

      <!-- Tag 4: Model Monitoring -->
      <rect x="475" y="0" width="155" height="32" class="tag-box" />
      <text x="487" y="21" class="tag">📊 Model Monitoring</text>

      <!-- Tag 5: Compliance -->
      <rect x="645" y="0" width="175" height="32" class="tag-box" />
      <text x="657" y="21" class="tag">📜 EU AI Act &amp; NIST</text>
    </g>

    <!-- Bottom highlights -->
    <g transform="translate(0, 335)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        ⭐ Top Commercial Platforms vs. 100% Composable Open-Source Production Stacks
      </text>
    </g>
  </g>
</svg>
